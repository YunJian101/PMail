name: docker-image

# 构建并推送镜像到 GitHub Container Registry（ghcr.io）
# 推 docker 分支或 2.0.0beta 标签时自动跑，也可以在 Actions 页面手动触发。
on:
  push:
    branches: [docker]
    tags: ['2.0.0beta']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ghcr 的镜像名必须全小写
          tags: |
            ghcr.io/yunjian101/pmail:2.0.0beta
            ghcr.io/yunjian101/pmail:latest
          labels: |
            org.opencontainers.image.title=PMail
            org.opencontainers.image.version=2.0.0beta
            org.opencontainers.image.description=Private mail server with a React frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

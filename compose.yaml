name: pmail

services:
  pmail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 基础镜像与包源都可以换（连不上官方源时在 .env 里覆盖即可）
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        GO_IMAGE: ${GO_IMAGE:-golang:1.24-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.20}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        GO_PROXY: ${GO_PROXY:-https://proxy.golang.org,direct}
    image: pmail:${PMAIL_TAG:-local}
    container_name: pmail
    restart: unless-stopped
    stop_grace_period: 20s

    # SMTP / HTTP / POP3 / HTTPS / SMTPS / Submission / POP3S / IMAPS
    # 首次安装向导跑在容器内 80 端口，宿主机映射成 8080 时可以改成 "8080:80"
    ports:
      - "25:25"
      - "80:80"
      - "110:110"
      - "443:443"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"

    volumes:
      # 配置、证书、DKIM 私钥、SQLite 数据库都在这里，删容器不丢数据
      - ./config:/work/config

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # PMail 生成 DNS 记录时会请求外网取公网 IP；容器没有出网能力时这一步会卡住。
      # 需要走代理就在这里给，留空表示直连。
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}

    healthcheck:
      # 安装阶段 / 正常运行阶段都会回 /api/ping，未安装时是 errorNo=402
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
